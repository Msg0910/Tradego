[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradego"
version = "0.10.0"
description = "TradeGo Autonomous Algorithmic Trading Platform and Production Gateway"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "TradeGo Engineering Team" }
]

dependencies = [
    "fastapi>=0.115.0",
    "starlette>=0.38.0",
    "pydantic>=2.8.0",
    "uvicorn>=0.30.0",
    "argon2-cffi>=23.1.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gateway*", "services*", "strategies*", "brokers*", "config*"]
